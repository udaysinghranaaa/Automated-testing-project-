<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Advanced Upload</title><link rel="stylesheet" href="css/styles.css"></head><body><main>
<h1>Upload practice</h1><input id="file-input" type="file"><p id="upload-status" class="result">No file</p>

</main></body></html>
